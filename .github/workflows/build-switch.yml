name: Build Switch NRO

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 portlibs
        run: |
          dkp-pacman -S --noconfirm --needed \
            switch-sdl2 switch-sdl2_ttf \
            switch-freetype switch-libpng switch-zlib switch-harfbuzz
          ls $DEVKITPRO/portlibs/switch/lib/ | head -20

      - name: Build NRO
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          make -C switch 2>&1 | tee build.log
          ls -la switch/*.nro switch/*.nacp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kazoku-keikaku-nro
          path: |
            switch/kazoku-keikaku.nro
            switch/kazoku-keikaku.nacp
          if-no-files-found: error

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            switch/kazoku-keikaku.nro
            switch/kazoku-keikaku.nacp
