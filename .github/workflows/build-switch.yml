name: Build Switch NRO

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install devkitPro toolchain
        run: |
          wget -q https://apt.devkitpro.org/install-devkitpro-pacman -O /tmp/dkp-pacman.sh
          chmod +x /tmp/dkp-pacman.sh
          sudo /tmp/dkp-pacman.sh
          sudo dkp-pacman -Syu --noconfirm
          sudo dkp-pacman -S --noconfirm switch-dev
          echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV

      - name: Build NRO
        run: |
          source /etc/profile.d/devkit-env.sh
          make -C switch 2>&1 | tee build.log
          ls -la switch/*.nro switch/*.nacp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kazoku-keikaku-nro
          path: |
            switch/kazoku-keikaku.nro
            switch/kazoku-keikaku.nacp
          if-no-files-found: error

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            switch/kazoku-keikaku.nro
            switch/kazoku-keikaku.nacp
