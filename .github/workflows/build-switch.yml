name: Build Switch NRO

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build NRO
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          which aarch64-none-elf-gcc && aarch64-none-elf-gcc --version | head -1
          which elf2nro || echo "elf2nro not found"
          make -C switch 2>&1 | tee build.log
          ls -la switch/*.nro switch/*.nacp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kazoku-keikaku-nro
          path: |
            switch/kazoku-keikaku.nro
            switch/kazoku-keikaku.nacp
          if-no-files-found: error

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            switch/kazoku-keikaku.nro
            switch/kazoku-keikaku.nacp
